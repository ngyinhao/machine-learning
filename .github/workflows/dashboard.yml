name: Dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  dashboard-smoke:
    name: Dashboard smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -r scripts/dashboard-check-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_dashboard.py
      - run: python scripts/check_dashboard.py --hosted
